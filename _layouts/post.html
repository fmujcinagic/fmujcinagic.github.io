---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="meta">
      {% if page.date %}<span>{{ page.date | date: "%Y-%m-%d" }}</span>{% endif %}
      {% if page.category %}<span class="chip">{{ page.category }}</span>{% endif %}
      {% if page.tags %}
        {% for tag in page.tags %}
          <span class="chip chip-light">{{ tag }}</span>
        {% endfor %}
      {% endif %}
    </p>
  </header>

  {% if page.cover_image %}
    <img class="cover" src="{{ page.cover_image | relative_url }}" alt="{{ page.title }} cover image">
  {% endif %}

  <div class="content">
    {{ content }}
  </div>
</article>
